name: tests

# Те же тесты, что автообновление гоняет на сервере перед деплоем
# (docker/Dockerfile, этап `tests`). Здесь они — чтобы красный коммит было видно
# сразу в PR, а не через пять минут в уведомлении об откате.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    # База поднимается службой, а не файлом рядом. Другой базы у продукта нет,
    # и набор на чужом движке бывает зелёным, ничего при этом не обещая: обе
    # беды, найденные за последний заход (500 на двойном нажатии и запертая
    # насмерть система без владельцев), были на боевом сервере всё время и не
    # видел их только набор — потому что гонялся на файле.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testy
          MYSQL_DATABASE: opencrm_test
        ports: ["3306:3306"]
        # По TCP, а не через сокет: сокет отвечает РАНЬШЕ, чем сервер начинает
        # слушать порт (первый запуск поднимает временный сервер, чтобы создать
        # базу). Без этого набор стартует в пустоту на быстрой машине.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -P 3306 --protocol=TCP --silent -ptesty"
          --health-interval=3s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=60s
      # Redis нужен по той же причине, по которой здесь появилась MySQL: без
      # него живой слой мессенджера проверить НЕЧЕМ. Шина событий и присутствие
      # живут только в нём, и проверки на них либо пропускаются, либо зеленеют,
      # ничего не проверив.
      #
      # Забыть его здесь легко и уже случилось: Redis добавили в ворота деплоя,
      # а сюда нет, и CI покраснел «Redis недоступен» на коде, который в
      # воротах зелёный. Красные ворота и зелёный CI (или наоборот) — это две
      # разные правды об одном коде, и верить после этого перестают обеим.
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=2s
          --health-timeout=3s
          --health-retries=15
    env:
      OPENCRM_TEST_DB_URL: "mysql+pymysql://root:testy@127.0.0.1:3306/opencrm_test?charset=utf8mb4"
      OPENCRM_REDIS_URL: "redis://127.0.0.1:6379/0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # ffmpeg — постеры и длительность видео (core/services/media_service.py).
      # Без него часть тестов деградирует на другую ветку кода, и проверка
      # получилась бы не той, что на боевом сервере.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # Фронтенд собирается и здесь — по той же причине, что и ffmpeg выше.
      # web/frontend/crm/dist в git не хранится, а web/main.py регистрирует
      # маршруты SPA, только когда каталог сборки на месте. Без этого шага
      # проверки SPA молча превращались бы в 404, и заодно ошибка TypeScript
      # проезжала бы через зелёный CI прямо в сборку на сервере.
      # Node 22 — как в docker/Dockerfile, этап `frontend`.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/frontend/crm/package-lock.json
      - run: npm ci
        working-directory: web/frontend/crm
      - run: npm run build
        working-directory: web/frontend/crm
      - run: pip install . pytest
      - run: python -m pytest
      # Второй прогон — в обратном порядке файлов. База у тестов общая на всю
      # сессию, и тест, оставивший после себя настройку или полсотни записей,
      # роняет соседа, а не себя: при одном и том же порядке такая связь
      # держится годами и вскрывается в тот день, когда файл переименовали.
      #
      # Обратный порядок ловит это одной командой и без случайности: прогон
      # либо зелёный всегда, либо красный всегда — «мигающих» тестов, которые
      # приходится ловить повторами, здесь не появляется.
      - run: python -m pytest $(ls tests/test_*.py | sort -r)

  # Установщик и точки входа контейнеров — обычный код, который выполняется на
  # чужих серверах, и цена ошибки в нём выше обычной. Сегодняшние поломки прода
  # были ровно этого класса: `\b` в шаблоне, не работающий в mawk; пайп,
  # съедавший код возврата; аргументы, уезжавшие в позиционные параметры sh -c.
  # Всё это ловится статическим анализом до сервера, а не на нём.
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # -s sh, а не bash: скрипты обязаны работать под dash — на голой Ubuntu
      # /bin/sh это он, и установщик не имеет права требовать того, что сам
      # ещё не поставил.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
      - run: shellcheck -s sh $(git ls-files '*.sh')
