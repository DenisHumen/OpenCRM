[project]
name = "opencrm"
version = "0.1.0"
description = "CRM for a design studio with a public client-facing showcase"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "alembic",
    "pydantic-settings",
    "bcrypt",
    "itsdangerous",
    "jinja2",
    "python-multipart",
    "pillow",
    "blurhash",
    # автоподбор логотипа сайта студии ходит наружу (core/services/site_logo_service.py).
    # Раньше httpx стоял только в dev-группе — в собранном образе его не было,
    # и приложение падало на импорте ещё до старта.
    "httpx",
    # Коды на бланках документов (core/services/codes.py), оба чистый Python.
    # QR — это Рид-Соломон и маскирование, такое не пишут руками. Code128
    # сначала был написан сам: таблица шаблонов казалась делом на сто строк,
    # но набранная по памяти оказалась битой в четырёх местах — проверка «сумма
    # модулей каждого шаблона равна 11» это и показала. Нечитаемый штрихкод на
    # руках у клиента — не та цена за сэкономленную зависимость.
    "segno",
    "python-barcode",
    # Драйвер MySQL. Чистый Python: не требует ни компилятора, ни libmysqlclient
    # в образе — mysqlclient быстрее, но тянет сборку C и заголовки, а узкое
    # место здесь не драйвер. Стоит в основных зависимостях, а не в extras:
    # переезд затевают на живой системе, и «доустановите пакет» посреди
    # переноса — лишний повод, чтобы он не состоялся.
    "pymysql",
]

[dependency-groups]
dev = ["pytest"]

# Пакеты перечислены явно: раскладка плоская (config/, core/, database/, web/ лежат
# в корне), и setuptools отказывается угадывать, что из этого пакет, а что — данные.
# Без этого `pip install .` падает на «Multiple top-level packages discovered»,
# то есть образ Docker не собирался вовсе.
[tool.setuptools.packages.find]
include = ["config*", "core*", "database*", "web*"]
# deploy/ — автообновление: работает на хосте, вне контейнера, и намеренно
# не является частью приложения (см. deploy/__init__.py).
exclude = ["tests*", "scripts*", "design*", "docs*", "docker*", "deploy*"]

# Шаблоны витрины и собранная SPA — не .py, но без них приложение не поднимется
[tool.setuptools.package-data]
"web.public" = ["templates/*.html", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
