<!doctype html>
<html lang="{{ site.get('showcase_locale', 'en') }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block title %}{{ site.brand_name }}{% endblock %}</title>
{% block og %}{% endblock %}
<style>
  /* Montserrat — шрифт витрины (SIL OFL), вариативный: один файл на все веса 100–900.
     Раздаётся со своего домена; swap, чтобы текст был виден до загрузки. */
  @font-face {
    font-family: "Montserrat";
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
    src: url("/static/fonts/montserrat-latin-wght-normal.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
      U+0304, U+0308, U+0329, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212,
      U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: "Montserrat";
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
    src: url("/static/fonts/montserrat-cyrillic-wght-normal.woff2") format("woff2");
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
  }
  :root {
    --bg: #161514;
    --surface: #201F1D;
    --surface-2: #2B2A27;
    --border: #2C2B28;
    --border-soft: #262523;
    --text: #F5F4EF;
    --muted: #9C998F;
    --faint: #706D64;
    --accent: {{ site.accent_color or '#D97757' }};
    --danger: #E5695E;
    --success: #4CAF6E;
    --lightbox: #0E0D0C;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.6 "Montserrat", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .serif { font-family: "Source Serif 4", Georgia, "Times New Roman", serif; font-weight: 400; }
  a { color: var(--accent); }
  .brand-mark { display: flex; align-items: center; gap: 8px; }
  .brand-mark .square {
    width: 22px; height: 22px; border-radius: 6px; background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    color: var(--bg); font-size: 11px; font-weight: 700; overflow: hidden;
  }
  .brand-mark .square img { width: 100%; height: 100%; object-fit: cover; }
  .brand-mark .name { color: var(--muted); font-size: 13px; font-weight: 500; letter-spacing: 0.02em; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

  /* курсор-кружок. mix-blend-mode: difference — кружок читается и на светлой
     фотографии, и на тёмном фоне, без подстройки цвета под содержимое. */
  /* выше лайтбокса (100): системный курсор на витрине скрыт, и кружок под
     полноэкранным просмотром выглядел бы как пропавший курсор */
  .cursor {
    position: fixed; top: 0; left: 0; z-index: 200;
    pointer-events: none; mix-blend-mode: difference;
    opacity: 0; transition: opacity 300ms; will-change: transform;
  }
  .cursor._on { opacity: 1; }
  .cursor__item {
    width: 32px; height: 32px; margin: -16px 0 0 -16px;
    border: 1.5px solid #fff; border-radius: 50%;
    transition: transform 350ms cubic-bezier(0.22, 0.61, 0.36, 1), background-color 350ms;
  }
  .cursor._active .cursor__item { transform: scale(1.75); background: rgba(255,255,255,0.18); }
  /* системный курсор прячем только там, где свой реально включён (см. скрипт ниже) */
  body._cursor-on, body._cursor-on * { cursor: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
{% block style %}{% endblock %}
</head>
<body>
{% block content %}{% endblock %}
<script>
  // Курсор-кружок. Включаем только там, где есть настоящий указатель: на тач-экране
  // системного курсора нет, а при reduced-motion лишнее движение не нужно — в обоих
  // случаях остаётся штатный курсор, поэтому cursor:none вешаем из скрипта, а не в CSS.
  (function () {
    var fine = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
    var calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!fine || calm) return;

    var dot = document.createElement("div");
    dot.className = "cursor";
    dot.innerHTML = '<div class="cursor__item"></div>';
    document.body.appendChild(dot);
    document.body.classList.add("_cursor-on");

    var x = 0, y = 0, frame = null;
    function draw() {
      frame = null;
      dot.style.transform = "translate3d(" + x + "px," + y + "px,0)";
    }
    document.addEventListener("mousemove", function (e) {
      x = e.clientX; y = e.clientY;
      dot.classList.add("_on");
      if (!frame) frame = requestAnimationFrame(draw);
    }, { passive: true });
    document.addEventListener("mouseover", function (e) {
      var node = e.target;
      var hot = node && node.closest && node.closest("a, button, .tile, input, [role='button']");
      dot.classList.toggle("_active", !!hot);
    }, { passive: true });
    // курсор ушёл за пределы окна — прячем кружок, иначе он «замирает» у края
    document.addEventListener("mouseleave", function () { dot.classList.remove("_on"); });
  })();
</script>
{% block script %}{% endblock %}
</body>
</html>
