<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="OpenCRM">
  <title>OpenCRM</title>
  <!-- Тот же знак, что в README (docs/assets/logo-mark.svg): модульная сетка
       витрины — крупная работа, узкая рядом и широкая внизу. Буква на 16
       пикселях превращается в пятно, а эта раскладка читается.

       Цвет зашит, а не берётся из настроек: иконку вкладки браузер запрашивает
       отдельным запросом к статике, где шаблонизатора уже нет. Витрина с
       загруженным логотипом студии подставляет его сама (base.html). -->
  <rect width="64" height="64" rx="16" fill="#D97757"/>
  <g fill="#F5F4EF">
    <rect x="14" y="14" width="20" height="20" rx="3"/>
    <rect x="38" y="14" width="12" height="20" rx="3" opacity="0.72"/>
    <rect x="14" y="38" width="36" height="12" rx="3" opacity="0.86"/>
  </g>
</svg>
