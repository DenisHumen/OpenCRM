name: opencrm

# Всё состояние живёт в домашнем каталоге того, кто запускает контейнеры
# (переопределяется переменной OPENCRM_HOME):
#
#   ~/opencrm/data/         SQLite-база
#   ~/opencrm/mysql/        каталог данных MySQL (только при установке на MySQL)
#   ~/opencrm/storage/      медиа досок, файлы клиентов, брендинг, аватары
#   ~/opencrm/letsencrypt/  сертификаты и приватные ключи
#   ~/opencrm/acme/         webroot для http-01-проверки Let's Encrypt
#
# Именованные тома Docker для этого не годятся: они лежат в /var/lib/docker,
# их не видно обычными средствами и легко снести вместе с `docker system prune`.
# Обычные каталоги видно, их просто забэкапить (scripts/backup.sh) и перенести.
#
# Переменные компоуза (домен, UID) — в docker/.env, см. docker/.env.example.
# Настройки приложения — по-прежнему в config/.env.

# Логи контейнеров по умолчанию не ротируются вовсе: json-файл растёт, пока не
# кончится диск. Сайт работает месяцами без присмотра, а забитый диск ломает не
# только логи — останавливаются загрузка файлов и обновления. 10 МБ × 3 файла на
# сервис — это заметно больше, чем нужно для разбора вчерашнего инцидента.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      # Этап указан явно: последний этап в Dockerfile — `tests`, и без этой
      # строки compose собирал бы его, таща pytest и тесты в боевой образ.
      target: app
    # required: false — стек поднимается и без файла, чтобы можно было просто
    # попробовать сборку. Боевые значения всё равно обязательны: без секретов
    # приложение с OPENCRM_ENV=production не стартует и скажет, чего не хватает.
    env_file:
      - path: ../config/.env
        required: false
    environment:
      # OPENCRM_DB_URL здесь НЕ задаётся, и это осознанно. `environment`
      # перекрывает `env_file`, поэтому строка тут делала бы выбор базы в
      # config/.env бессмысленным: `./opencrm.sh install` пишет туда либо
      # SQLite, либо MySQL с паролем, и перебить это compose'ом значит молча
      # вернуть всех на SQLite. Старые установки без этой строки не ломаются:
      # относительный `sqlite:///data/opencrm.db` из шаблона считается от
      # рабочего каталога образа (/app) и указывает на тот же файл, что и
      # прежний абсолютный URL.
      OPENCRM_STORAGE_DIR: /app/storage
      # За приложением стоит один nginx: реальный IP клиента — последний элемент
      # X-Forwarded-For, добавленный им. Без этого лимит подбора PIN обходится
      # подменой заголовка (см. docs/07-security.md).
      #
      # Значение берётся из docker/.env, потому что «сколько прокси впереди» —
      # свойство обвязки, как и домен. Задавать его в config/.env бесполезно:
      # `environment` в compose перекрывает `env_file`, и та строка молча ничего
      # не делала бы. Меняют его, когда впереди появляется ещё один прокси
      # (Cloudflare, балансировщик) — иначе все посетители сольются в один адрес.
      OPENCRM_TRUSTED_PROXY_HOPS: "${OPENCRM_TRUSTED_PROXY_HOPS:-1}"
    # Каталоги в домашней папке принадлежат хозяину машины, а не root'у, поэтому
    # процесс в контейнере должен работать под его же UID — иначе миграции
    # упрутся в «permission denied» на первом же запуске.
    user: "${OPENCRM_UID:-1000}:${OPENCRM_GID:-1000}"
    volumes:
      - ${OPENCRM_HOME:-${HOME}/opencrm}/data:/app/data
      - ${OPENCRM_HOME:-${HOME}/opencrm}/storage:/app/storage
    expose: ["8000"]
    # На SQLite службы `db` в стеке нет вовсе (она под профилем), поэтому
    # `required: false`: без него compose отказался бы поднимать приложение,
    # сославшись на невыполнимую зависимость. С ним условие работает ровно
    # тогда, когда база в стеке есть, — а тогда ждать её обязательно:
    # `alembic upgrade head` из entrypoint.sh стартует первым делом и без
    # живой базы падает, унося контейнер в цикл перезапуска.
    #
    # Цена `required: false` проверена живьём и принята сознательно: если база
    # не поднимается совсем (испорченный каталог данных), compose не ждёт её до
    # упора, а пишет предупреждение и стартует приложение. Сайт при этом всё
    # равно не работает, но причина видна в логе приложения, а не в вечном
    # «Waiting» без объяснений.
    depends_on:
      db:
        condition: service_healthy
        required: false
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      # start_period — не украшение. Без него отсчёт неудач идёт с первой
      # секунды, и приложению остаётся interval × retries на то, чтобы снять
      # копию базы, прогнать миграции и подняться. Сразу после `up -d --build`
      # машина занята сборкой, диск холодный — на боевом VPS в этот бюджет не
      # уложились, контейнер объявили нездоровым, деплой откатился, откат тоже
      # «не поднялся». В окне запуска неудачи не считаются вовсе.
      start_period: 90s
      # Короткий интервал не нагружает (запрос к localhost), зато готовность
      # замечается за секунды, а не за полминуты.
      interval: 10s
      timeout: 5s
      retries: 3

  # База, когда её выбрали при установке.
  #
  # Под профилем: на SQLite служба не описана «выключенной», её в стеке НЕТ.
  # Это не украшение — иначе `compose up -d` тянул бы образ MySQL, поднимал
  # лишний сервер и съедал под него полгигабайта памяти на машине, где база
  # лежит одним файлом. Профиль включается строкой COMPOSE_PROFILES=mysql в
  # docker/.env, которую пишет `./opencrm.sh install`; compose читает её сам,
  # поэтому все вызовы вида `compose up`, `compose ps`, `compose exec` видят
  # службу без единого дополнительного флага.
  db:
    image: mysql:8.0
    profiles: ["mysql"]
    # utf8mb4, а не utf8. В MySQL «utf8» — это три байта на символ, и эмодзи в
    # заметке клиента обрывают вставку на полуслове. Кодировка задаётся сервером,
    # а не только клиентом: база создаётся при первом старте контейнера, и
    # созданная в latin1 останется такой навсегда.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      # Пароли генерирует `./opencrm.sh install` и кладёт сюда через docker/.env
      # (файл с правами 600). Пустое значение здесь означает «профиль включили
      # руками, а паролей не завели» — образ MySQL в этом случае откажется
      # стартовать с внятным сообщением, и это лучше, чем база без пароля.
      MYSQL_ROOT_PASSWORD: ${OPENCRM_DB_ROOT_PASSWORD:-}
      MYSQL_DATABASE: ${OPENCRM_DB_NAME:-opencrm}
      MYSQL_USER: ${OPENCRM_DB_USER:-opencrm}
      MYSQL_PASSWORD: ${OPENCRM_DB_PASSWORD:-}
    volumes:
      # Обычный каталог, а не именованный том, — по той же причине, что и всё
      # остальное состояние: том лежит в /var/lib/docker, его не видно обычными
      # средствами и он уезжает вместе с `docker system prune --volumes`. База,
      # снесённая уборкой мусора, — не та цена за экономию одной строки.
      #
      # Каталог отдаётся контейнеру как есть: mysqld стартует от root, сам
      # выставляет владельца и уходит под своего пользователя. Поэтому здесь
      # НЕ повторяется `user:` из службы app — с чужим UID сервер не поднимется.
      - ${OPENCRM_HOME:-${HOME}/opencrm}/mysql:/var/lib/mysql
    # Проверка идёт по TCP, и это главное в ней.
    #
    # `mysqladmin ping` без --protocol ходит через unix-сокет, а сокет отвечает
    # РАНЬШЕ, чем сервер начинает слушать порт: при первом запуске образ поднимает
    # временный сервер с выключенной сетью, чтобы создать базу и пользователя.
    # Проверено живьём: с проверкой по сокету контейнер объявлялся healthy на
    # седьмой секунде, а TCP-подключение в этот момент ещё отвергалось. Приложение
    # по такому сигналу стартует раньше базы и падает на `alembic upgrade head`.
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -P 3306 --protocol=TCP --silent"]
      # Первый запуск создаёт каталог данных с нуля: на медленном диске VPS это
      # минуты. В окне запуска неудачи не считаются — иначе стек объявят
      # сломанным ровно тогда, когда он просто ещё не готов.
      start_period: 180s
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *logging

  nginx:
    image: nginx:alpine
    environment:
      OPENCRM_DOMAIN: ${OPENCRM_DOMAIN:-_}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/templates:/opencrm/templates:ro
      - ./nginx/entrypoint.sh:/opencrm/entrypoint.sh:ro
      # страница на время, пока приложения нет (обновление, миграции, перезапуск)
      - ./nginx/maintenance:/opencrm/maintenance:ro
      - ${OPENCRM_HOME:-${HOME}/opencrm}/storage:/srv/storage:ro
      # ключи нужны только на чтение: писать в них — дело certbot
      - ${OPENCRM_HOME:-${HOME}/opencrm}/letsencrypt:/etc/letsencrypt:ro
      - ${OPENCRM_HOME:-${HOME}/opencrm}/acme:/var/www/certbot
    entrypoint: ["/bin/sh", "/opencrm/entrypoint.sh"]
    # service_started, а НЕ service_healthy. nginx не обращается к приложению
    # при старте: имя `app` резолвится на каждый запрос через встроенный DNS
    # (см. resolver в locations.inc), поэтому подниматься раньше ему ничто не
    # мешает. А вот ждать здоровья — мешает сильно: пока приложение
    # разворачивается после сборки, nginx не стартовал вовсе, и сайт не просто
    # показывал заглушку, а не отвечал совсем — 80 и 443 никто не слушал.
    #
    # Страница обслуживания существует ровно для этого промежутка: пусть лучше
    # посетитель увидит «скоро вернёмся», чем отказ соединения.
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped
    logging: *logging

  # Продление сертификата. Первый выпуск — руками, один раз:
  #   docker compose run --rm --entrypoint certbot certbot certonly \
  #       --webroot -w /var/www/certbot \
  #       -d example.com --email you@example.com --agree-tos --no-eff-email
  #
  # --entrypoint здесь обязателен: `run` подменяет команду, а не entrypoint, а
  # entrypoint ниже — бесконечный цикл продления. Без флага аргументы `certonly`
  # уедут в позиционные параметры `sh -c` и не выполнятся: контейнер запустит
  # продление навечно, а выпуск повиснет.
  # Дальше этот контейнер сам проверяет срок дважды в сутки; Let's Encrypt
  # обновляет сертификат за 30 дней до истечения, а nginx перечитывает конфиг
  # каждые 6 часов (см. nginx/entrypoint.sh) и подхватывает новый файл.
  certbot:
    image: certbot/certbot
    volumes:
      - ${OPENCRM_HOME:-${HOME}/opencrm}/letsencrypt:/etc/letsencrypt
      - ${OPENCRM_HOME:-${HOME}/opencrm}/acme:/var/www/certbot
    entrypoint: >
      /bin/sh -c 'trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done'
    depends_on: [nginx]
    restart: unless-stopped
    logging: *logging
