# Проверка сайта снаружи.
#
# Один модуль на всё: обычный GET по публичному адресу. Ему же мы обязаны
# сроком сертификата — `probe_ssl_earliest_cert_expiry` появляется сам, когда
# соединение прошло через TLS.

modules:
  http_2xx:
    prober: http
    # Восемь секунд при интервале в тридцать: медленный ответ должен попасть в
    # `probe_duration_seconds` и в правило «сайт тормозит», а не превратиться в
    # «сайт лежит». Совсем без потолка проверка висела бы до следующей.
    timeout: 8s
    http:
      method: GET
      # Редирект проходим до конца — и это НЕ то же самое, что у health-check
      # автообновления, где он запрещён.
      #
      # Там проверка идёт по http://127.0.0.1/, сайт отвечает перенаправлением
      # на https://127.0.0.1/, и сертификат, выписанный на домен, к IP-адресу не
      # подходит по определению: пойти по такому редиректу значит всегда
      # упереться в ошибку. Здесь адрес — публичное имя сайта, то самое, на
      # которое выписан сертификат, поэтому редирект http → https ведёт туда,
      # где всё сходится, и пройти его надо: иначе установка, где OPENCRM_BASE_URL
      # ещё http, а сайт уже на https, вечно показывала бы «сайт лежит».
      follow_redirects: true
      valid_status_codes: []  # пусто = любой 2xx
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      # Проверка сертификата НЕ отключается. Просроченный или выписанный не на
      # тот домен сертификат — это ровно та поломка, о которой надо узнать:
      # посетитель увидит красный экран браузера, а `insecure_skip_verify: true`
      # показал бы зелёную галочку.
      tls_config:
        insecure_skip_verify: false
      # IPv6 у VPS часто объявлен в DNS и не работает на самом деле; проверка
      # по нему краснела бы при полностью живом сайте.
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
