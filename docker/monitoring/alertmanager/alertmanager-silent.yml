# Запасной конфиг: канал не настроен.
#
# Alertmanager с пустым `bot_token` не стартует и уходит в цикл перезапуска —
# то есть ломает ровно то правило, которое сам должен сторожить. Поэтому без
# токена он поднимается с приёмником, который никуда не пишет: тревоги видны на
# дашборде и в его собственном интерфейсе, но сообщений не будет.
#
# Это состояние объявляется вслух: entrypoint.sh пишет предупреждение в лог, а
# `./opencrm.sh doctor` показывает его отдельной строкой.

global:
  resolve_timeout: 5m

route:
  receiver: nowhere
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 24h

receivers:
  - name: nowhere
