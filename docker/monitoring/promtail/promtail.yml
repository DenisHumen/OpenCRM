# Promtail: забирает логи контейнеров и по дороге считает по ним метрики.
#
# Две работы в одном процессе, и вторая — не бесплатное дополнение. Доли ответов
# 4xx/5xx и время ответа берутся из журнала nginx, потому что **только он видит
# 502**: приложение о своих пятисотках знает, а о том, что до него не дозвонились
# вовсе, — по определению нет, его в этот момент не существует.
#
# Источник — docker, а не файлы в /var/lib/docker/containers. Имя контейнера в
# пути отсутствует, там только его идентификатор, и разобрать «это nginx, а это
# приложение» по такому пути нельзя. Ценой служит сокет docker, примонтированный
# на чтение: доступ к нему равносилен root на машине, и это осознанный размен,
# названный в docs/ekspluatatsiya/08-razvyortyvanie.md.

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  # На ТОМЕ, а не в /tmp. Прежде здесь стоял /tmp с доводом «потеряется —
  # промотает логи заново, это дешевле, чем ещё один каталог состояния».
  # Довод оказался неверным, и вот чем.
  #
  # Промотка заново означает отправку в Loki записей недельной давности, а
  # Loki старше `reject_old_samples_max_age` (168 ч) не принимает и отвечает
  # 400 на ВЕСЬ пакет — вместе со свежими строками, которые в нём ехали.
  # Снято с боевого: «entry for stream has timestamp too old: 2026-08-14,
  # oldest acceptable is 2026-08-18». То есть перезапуск promtail не просто
  # тратил время, а ТЕРЯЛ свежие логи.
  filename: /promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    # Loki поднимается не мгновенно; без запаса первые минуты логов терялись бы
    # ровно на старте стека — то есть тогда, когда они и нужны.
    backoff_config:
      min_period: 1s
      max_period: 5m
      max_retries: 20

scrape_configs:
  - job_name: opencrm
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 30s
        # Отбор делает демон, а не `keep` ниже: `keep` отбрасывает уже
        # заведённую цель, и promtail успевает открыть поток и завести курсор
        # каждому контейнеру машины. Замеры — в docs/ekspluatatsiya/08-razvyortyvanie.md.
        filters:
          - name: label
            values:
              - "com.docker.compose.project=opencrm"
              # Одноразовые (`compose run --rm`) несут ТУ ЖЕ метку службы, что
              # живое приложение, и их вывод ложился в его поток — панель
              # «Ошибки приложения» показывала вывод разовой проверки настроек.
              - "com.docker.compose.oneoff=False"

    relabel_configs:
      # Только свои контейнеры. На сервере рядом может крутиться что угодно
      # чужое, и тащить это в свой Loki — значит платить за чужие логи местом и
      # памятью.
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        regex: opencrm
        action: keep
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      # Себя и Loki не читаем: promtail пишет о том, что читает, Loki — о том,
      # что принял, и вдвоём они устраивают петлю, в которой полезных строк нет
      # вовсе.
      - source_labels: [service]
        regex: "promtail|loki"
        action: drop

    pipeline_stages:
      # --- журнал nginx: считаем ответы, не сохраняя, кто их спрашивал --------
      - match:
          selector: '{service="nginx"}'
          stages:
            - json:
                expressions:
                  status: status
                  request_time: request_time
                  # `path` достаётся ТОЛЬКО ради распознавания перебора ниже и
                  # меткой не становится: путь как метка — это неограниченное
                  # число потоков, заводимых кем угодно снаружи. В самой строке
                  # журнала он и так есть, и поиску по Loki этого достаточно.
                  #
                  # Забыть эту строку — ТИХАЯ беда, и в этом вся её опасность.
                  # `.path` в шаблоне окажется пустым, `regexMatch` не совпадёт
                  # ни разу, счётчик перебора останется вечным нулём — а
                  # promtail при этом поднимется как ни в чём не бывало, и
                  # график будет говорить «никто нас не щупает». Поймано пробой
                  # `promtail -dry-run` на десятке поддельных строк журнала:
                  # метка `shchup` не появилась НИ НА ОДНОЙ, включая
                  # `/wp-login.php` и `/.env`.
                  #
                  # Проверять этот конвейер, ничего не поднимая, можно так —
                  # promtail умеет читать файл вместо докера и печатать метки
                  # вместо отправки в Loki:
                  #
                  #     docker run --rm -v "$PWD/proba:/proba" \
                  #         grafana/promtail:3.4.1 \
                  #         -config.file=/proba/promtail.yml -dry-run
                  #
                  # (в `proba/promtail.yml` — этот же файл, но `docker_sd_configs`
                  # заменён на `static_configs` с `__path__` к поддельному
                  # журналу). Стоит это двадцать секунд и ловит обе беды разом:
                  # и незапускающийся конфиг, и молча несовпадающий шаблон.
                  path: path
            # Класс ответа вместо самого кода: 404 и 410 в одном ряду отвечают
            # на вопрос «сколько ошибок клиента», а полторы сотни кодов по
            # отдельности не отвечают ни на один и стоят полутора сотен рядов.
            - template:
                source: status_class
                template: '{{ if .status }}{{ substr 0 1 .status }}xx{{ end }}'
            # Точный код — ТОЛЬКО для ошибок, и в этом весь размен.
            #
            # Соседний довод (про класс вместо кода) остаётся в силе для
            # успешных ответов: 200, 204 и 304 в одном ряду отвечают на вопрос
            # «сколько отдали», и разбирать их по кодам незачем. Но у ОШИБОК
            # код — это и есть диагноз, а класс его прячет. 500 значит «упало
            # приложение», 502 — «приложения нет вовсе», 504 — «оно думает
            # дольше, чем nginx готов ждать», и чинятся эти три вещи по-разному.
            # Слитые в «5xx», они дают одинаковый график на три разные аварии.
            #
            # Пустое значение для 2xx и 3xx — не заглушка: Loki считает пустую
            # метку отсутствующей, то есть на успешных ответах нового потока не
            # заводится вовсе. Рядов прибавляется около полутора десятков (коды
            # ошибок, которые вправду встречаются), а не полторы сотни.
            - template:
                source: kod
                template: >-
                  {{ if or (hasPrefix "4" .status) (hasPrefix "5" .status) }}{{ .status }}{{ end }}
            # Прощупывание: бот идёт по списку известных дыр и получает 404.
            #
            # **Зачем отдельно от общего счёта 404.** Человек тоже попадает в
            # 404 — по старой ссылке, по опечатке. Такие промахи размазаны по
            # суткам и малочисленны. Перебор известных путей выглядит иначе:
            # десятки запросов за секунды, и ни один из этих путей в проекте не
            # существовал никогда. Слитые в один счётчик, они неразличимы, и
            # график «404 в секунду» приходится читать гаданием.
            #
            # **Почему разбор здесь, а не в nginx.** В nginx для этого нужен
            # `map` по `$uri` в блоке `http`, то есть правка боевого шаблона
            # конфигурации: ошибка там роняет сайт целиком, ошибка здесь —
            # только график. Цена ошибки решает, где стоять коду.
            #
            # **Категории, а не сами пути.** Путь как метка — это неограниченное
            # число рядов, и завести их в Prometheus может кто угодно снаружи,
            # бесплатно, просто постучавшись по случайным адресам. Категорий
            # шесть, и больше их не станет.
            #
            # Обратная косая здесь ДВОЙНАЯ, и это тоже проверено пробой, а не
            # угадано. Слоёв разбора два, и они разные: блочный скаляр YAML
            # (`>-`) escape-последовательностей не трогает вовсе, а Go читает
            # строки внутри шаблона как строковые литералы, где `\.` —
            # недопустимая последовательность. Одинарная косая роняет promtail
            # на разборе конфигурации целиком (`invalid template stage config:
            # invalid syntax`), то есть мониторинг просто не поднимается. Так
            # что `\\.` в файле → `\.` у Go → «точка» в регулярном выражении.
            - template:
                source: shchup
                template: >-
                  {{ if regexMatch "(?i)(wp-login|wp-admin|wp-content|wp-includes|xmlrpc)" .path }}wordpress{{
                  else if regexMatch "(?i)(/\\.env|/\\.git|/\\.aws|/\\.ssh|credentials|id_rsa)" .path }}sekrety{{
                  else if regexMatch "(?i)(phpmyadmin|/pma|myadmin|\\.php$)" .path }}php{{
                  else if regexMatch "(?i)(cgi-bin|/shell|/cmd|eval-stdin|\\.\\./)" .path }}obolochka{{
                  else if regexMatch "(?i)(/actuator|/jenkins|/solr|/manager/html|/_ignition|/console)" .path }}chuzhaya-panel{{
                  else if regexMatch "(?i)(\\.sql$|\\.bak$|\\.zip$|backup|dump)" .path }}vygruzka{{
                  end }}
            - labels:
                status_class:
                kod:
                shchup:
            - metrics:
                # `_total` в имени — не украшение, а часть имени.
                #
                # Promtail отдаёт метрику ровно так, как она названа здесь, и
                # НИЧЕГО не дописывает: счётчик, названный
                # `opencrm_nginx_responses`, наружу выходит как
                # `promtail_custom_opencrm_nginx_responses` — без привычного
                # суффикса. Поймано на стенде: правило про долю 5xx смотрело на
                # имя с `_total`, которого не существовало, и молчало бы при
                # любой аварии. Молчащее правило неотличимо от исправного, пока
                # не случится то, ради чего оно написано.
                opencrm_nginx_responses_total:
                  type: Counter
                  description: "Ответы nginx по классам кода ответа"
                  # `source` обязателен: без него счётчик щёлкал бы и на строках
                  # журнала ОШИБОК nginx, которые в тот же поток попадают и
                  # ответами не являются. Тогда знаменатель доли 5xx врал бы.
                  source: status
                  config:
                    action: inc
                opencrm_nginx_request_seconds:
                  type: Histogram
                  description: "Время ответа nginx, секунды"
                  source: request_time
                  config:
                    action: observe
                    buckets: [0.1, 0.3, 1.0, 3.0, 10.0]
                # Прощупывание отдельным счётчиком, а не меткой на общем.
                #
                # Метка на `opencrm_nginx_responses_total` заставила бы каждый
                # запрос об этом счётчике («сколько всего ответов») складывать
                # по ещё одному измерению, которое к вопросу отношения не имеет.
                # Отдельный счётчик спрашивается отдельно и не мешает соседям.
                #
                # `source: shchup` обязателен: без него счётчик щёлкал бы на
                # КАЖДОМ ответе nginx, включая успешные, и «прощупываний в
                # секунду» стало бы просто вторым именем для RPS. С `source`
                # строки с пустым значением пропускаются — то есть считается
                # ровно то, что распознано как перебор.
                opencrm_nginx_probes_total:
                  type: Counter
                  description: "Запросы по известным путям перебора, по видам"
                  source: shchup
                  config:
                    action: inc

      # --- всё остальное: просто в Loki, с пометкой уровня --------------------
      #
      # Уровень выделяется меткой, чтобы «покажи ошибки за час» было одним
      # щелчком, а не чтением всего подряд.
      #
      # ПРИВЕДЕНИЕ РЕГИСТРА — не косметика, а единственное, что делает метку
      # пригодной для запроса. `(?i)` заставляет regex ИСКАТЬ без разбора
      # регистра, но в группу попадает то, что вправду написано в строке.
      # Замерено на стенде (`/loki/api/v1/label/level/values`): без приведения
      # метка принимала ШЕСТЬ значений — `Error`, `Traceback`, `WARNING`,
      # `Warning`, `error`, `traceback`, — потому что uvicorn пишет `ERROR`,
      # Python начинает трассировку с `Traceback`, MySQL говорит `Warning`, а
      # Redis — `WARNING`. Селектор Loki при этом сравнивает ТОЧНО: запрос
      # `level=~"error|critical|traceback"` не совпадал ни с одним из них,
      # кроме случайно попавших внутрь слов (`raise_for_error`,
      # `with_traceback`). То есть панель «Ошибки приложения» показывала обрывки
      # трассировок и молчала о настоящих `ERROR` и `CRITICAL` — а выглядело это
      # как «ошибок нет».
      #
      # Побочная выгода: значений становится три вместо шести, и потоков в Loki
      # (а значит, кусков на диске) — вдвое меньше на каждую службу.
      - match:
          selector: '{service!="nginx"}'
          stages:
            # `critical` первым: строку «CRITICAL error while …» правильнее
            # отнести к критическим, а RE2 при равной позиции берёт левую ветку.
            - regex:
                expression: "(?i)(?P<level>critical|error|warning|traceback)"
            - template:
                source: level
                template: '{{ ToLower .Value }}'
            - labels:
                level:
