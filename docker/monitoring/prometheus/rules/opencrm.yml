# Поводы разбудить человека.
#
# Это главный файл всего стека. Дашборд смотрят, когда уже заподозрили неладное;
# оповещение приходит само — и только оно отвечает на задачу, ради которой всё
# затевалось: **узнать о поломке раньше клиента.**
#
# Правила отсюда:
#
# * `severity: critical` — сайт не работает или вот-вот перестанет. Такие уходят
#   в Telegram сразу и повторяются каждый час, пока не починят;
# * `severity: warning` — работает, но так дальше нельзя. Уходят тоже, но
#   повторяются раз в сутки, чтобы не приучить не читать.
#
# `for:` у каждого правила не для красоты: без выдержки одна неудачная проверка
# в момент обновления контейнера присылала бы «сайт лёг» на каждом деплое, и
# через неделю эти сообщения перестали бы читать.
#
# `keep_firing_for:` — про вторую половину той же беды, и она вылезла позже.
# `for:` держит вход в тревогу, но выход из неё мгновенный: показатель, который
# ходит вокруг порога, даёт «тревога» — «всё в порядке» — «тревога» — «всё в
# порядке» и приучает не читать быстрее, чем ложная тревога. Поймано на доле
# 4xx: четыре сообщения за три часа об одном и том же. `keep_firing_for` держит
# тревогу зажжённой ещё столько-то после того, как условие отпустило, — то есть
# ставит порогу гистерезис, которого у него нет.
#
# Правило простое: **у всякой тревоги, чьё условие умеет качаться туда-сюда,
# гистерезис обязателен.** Исключений ровно четыре, и все четыре — про
# показатели, которые качаться не умеют:
#
# * `CertificateExpiringSoon` — счётчик дней идёт только вниз, а вверх прыгает
#   один раз, продлением, и это настоящая новость;
# * `BackupTooOld` — возраст копии растёт монотонно, гаснет от появления новой;
# * `BackupBroken` — меняется раз в сутки, в момент снятия копии;
# * `DeployRolledBack` — гаснет по своему собственному часовому окну, и
#   гистерезис спорил бы с этим замыслом.
#
# Сторож на это правило — `tests/test_monitoring.py`.
#
# --- про `{{ $value }}` ---
#
# Число в тексте отвечает на вопрос, который человек задаёт первым: «насколько
# всё плохо». «Доля 4xx — 63%» и «доля 4xx выше 40%» стоят одинаково, а решение
# по ним принимается разное. Поэтому значение стоит в `summary`: именно summary
# уезжает в первую строку сообщения, а её и видно в списке чатов.
#
# Доли печатаются `humanizePercentage`, и это не вкусовщина. Выражения вроде
# `avail / size` дают ДОЛЮ (0.08), а не проценты, и привычное
# `printf "%.1f%%"` напечатало бы «0.1%» вместо «8%» — то есть соврало бы в
# сто раз в тексте про кончающийся диск. `humanizePercentage` умножает на сто
# сам. Секунды, дни и штуки — по-прежнему `printf`, там множителя не нужно.
#
# Чего здесь НЕТ намеренно: правила «цель не отвечает» на приложение
# (`up{job="opencrm-app"}`). Блок мониторинга выключается в интерфейсе, и
# выключенный он закрывает `/api/v1/metrics` вместе с остальным своим API —
# честное «блок выключен» выглядело бы как поломка. Что приложения нет по
# правде, скажет проверка сайта снаружи, а она в этом не ошибается.

groups:
  - name: opencrm-site
    rules:
      - alert: SiteDown
        # Проверка идёт снаружи, через nginx и настоящий 443. Именно так и
        # выглядел случай, ради которого всё это делалось: приложение отвечало
        # на localhost, а снаружи не отвечал никто.
        expr: probe_success{job="site"} == 0
        for: 2m
        # Проверка снаружи спотыкается и на чужой сети: моргнувший канал даёт
        # «лёг» — «поднялся» — «лёг» на ровном месте. Десять минут гистерезиса
        # склеивают такую серию в одно событие, а настоящее падение столько не
        # чинится всё равно.
        keep_firing_for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Сайт не отвечает: {{ $labels.instance }}"
          description: "Внешняя проверка не проходит уже 2 минуты."
          lechenie: |-
            ./opencrm.sh doctor
            ./opencrm.sh logs nginx
            ./opencrm.sh logs app

      - alert: SiteSlow
        # Медленно — это ещё не лежит, поэтому выдержка длинная: короткая
        # присылала бы сообщение на каждую резервную копию и каждую сборку.
        expr: probe_duration_seconds{job="site"} > 3
        for: 10m
        keep_firing_for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Сайт отвечает {{ $value | printf \"%.1f\" }} с (порог 3 с)"
          description: "Проверка снаружи: {{ $labels.instance }}"

      - alert: CertificateExpiringSoon
        # Продление идёт само (certbot дважды в сутки, Let's Encrypt обновляет
        # за 30 дней), поэтому 14 дней — это уже «продление сломано», а не
        # «скоро пора». Ряда нет вовсе, когда сайт работает по HTTP, — и тогда
        # правило молчит, что верно: продлевать нечего.
        expr: (probe_ssl_earliest_cert_expiry{job="site"} - time()) / 86400 < 14
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "Сертификат истекает через {{ $value | printf \"%.0f\" }} дней"
          description: "Автопродление не сработало."
          lechenie: |-
            ./opencrm.sh logs certbot
            ./opencrm.sh https

      - alert: HighErrorRate
        # Доля пятисоток за пять минут. Знаменатель ограничен снизу и по частоте,
        # и по классу ответа:
        #
        # * без порога по частоте одна ошибка на два ночных запроса давала бы
        #   50% и будила бы человека каждую ночь;
        # * `status_class=~"[1-5]xx"` отсекает строки журнала ошибок nginx,
        #   попадающие в тот же поток: они не ответы и в знаменателе им не место.
        expr: >-
          sum(rate(promtail_custom_opencrm_nginx_responses_total{status_class="5xx"}[5m]))
          /
          sum(rate(promtail_custom_opencrm_nginx_responses_total{status_class=~"[1-5]xx"}[5m]))
          > 0.05
          and
          sum(rate(promtail_custom_opencrm_nginx_responses_total{status_class=~"[1-5]xx"}[5m])) > 0.05
        for: 5m
        keep_firing_for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Доля ответов 5xx — {{ $value | humanizePercentage }} (порог 5%)"
          description: "Столько запросов заканчивается ошибкой сервера."
          lechenie: "./opencrm.sh logs app"

      - alert: HighClientErrorRate
        # Четырёхсотки сами по себе норма (чужие боты, старые закладки), но
        # резкий рост — это обычно сломанный фронтенд после обновления.
        #
        # Окно 30 минут, а не 10, и порог потока втрое выше — потому что на
        # маленькой установке доля считается от десятка запросов, и один чужой
        # сканер перебирает её через порог туда-обратно. Это и случилось:
        # тревога и отбой чередовались весь день, а поломки не было ни разу.
        expr: >-
          sum(rate(promtail_custom_opencrm_nginx_responses_total{status_class="4xx"}[30m]))
          /
          sum(rate(promtail_custom_opencrm_nginx_responses_total{status_class=~"[1-5]xx"}[30m]))
          > 0.4
          and
          sum(rate(promtail_custom_opencrm_nginx_responses_total{status_class=~"[1-5]xx"}[30m])) > 0.6
        for: 15m
        # Отпустило — держим тревогу зажжённой ещё полчаса. Настоящая поломка
        # столько не чинится, а мигание порога на этом кончается.
        keep_firing_for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Доля ответов 4xx — {{ $value | humanizePercentage }} (порог 40%)"
          description: "Похоже на сломанный фронтенд или чужой перебор адресов."
          lechenie: "./opencrm.sh logs nginx"

  - name: opencrm-host
    rules:
      - alert: DiskAlmostFull
        # Кончившееся место останавливает не только логи: встают загрузка
        # файлов, резервные копии и сами обновления. 15 минут выдержки — чтобы
        # сборка образа, временно съедающая гигабайты, не считалась аварией.
        expr: >-
          node_filesystem_avail_bytes{mountpoint="/", fstype!~"tmpfs|overlay|squashfs"}
          /
          node_filesystem_size_bytes{mountpoint="/", fstype!~"tmpfs|overlay|squashfs"}
          < 0.10
        for: 15m
        # Место дышит: сборка образа занимает и отдаёт гигабайты, ротация логов
        # освобождает и снова набирает. У самого порога это давало бы серию.
        keep_firing_for: 30m
        labels:
          severity: critical
        annotations:
          summary: "На диске свободно {{ $value | humanizePercentage }} (порог 10%)"
          description: "Место кончается: дальше встанут загрузки, копии и сборка обновления."
          lechenie: |-
            ./opencrm.sh doctor
            docker image prune

      - alert: HostMemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 15m
        keep_firing_for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Свободной памяти {{ $value | humanizePercentage }} (порог 10%)"
          description: >-
            На маленьком VPS следующая сборка образа может не пройти.

      - alert: HostSwapping
        # Своп сам по себе не беда, а вот постоянная запись в него означает, что
        # памяти не хватает по-настоящему, и сайт при этом уже подтормаживает.
        expr: rate(node_vmstat_pswpout[15m]) > 100
        for: 30m
        keep_firing_for: 30m
        labels:
          severity: warning
        annotations:
          summary: >-
            Машина уходит в подкачку: {{ $value | printf "%.0f" }} страниц/с (порог 100)
          description: "Памяти не хватает; сайт отвечает медленнее, чем мог бы."

  - name: opencrm-containers
    rules:
      - alert: ContainerRestartLoop
        # Цикл перезапуска снаружи выглядит как работающий сайт: контейнер
        # поднимается, отвечает несколько секунд и падает снова. `restart:
        # unless-stopped` делает это бесконечно и молча.
        #
        # Считаем по счётчику самого docker (`RestartCount`), а не по скачкам
        # времени старта: второе не отличает перезапуск от обновления, при
        # котором контейнер пересоздаётся штатно и время старта тоже меняется.
        expr: increase(opencrm_container_restarts_total[15m]) > 3
        for: 5m
        # Окно `increase` скользящее: как только первые перезапуски выпадут из
        # пятнадцати минут, счёт провалится под порог и тут же вернётся на
        # следующем падении. Без гистерезиса цикл перезапуска приходил бы
        # чередой сообщений вместо одного.
        keep_firing_for: 15m
        labels:
          severity: critical
        annotations:
          summary: >-
            Контейнер {{ $labels.service }} перезапустился
            {{ $value | printf "%.0f" }} раза за 15 минут
          description: "Причина — в логе контейнера."
          lechenie: "./opencrm.sh logs {{ $labels.service }}"

      - alert: ContainerUnhealthy
        # Не то же самое, что «упал». Контейнер работает, docker его не трогает,
        # а собственная проверка здоровья не проходит — например, приложение
        # отвечает, но не достучалось до базы. Снаружи это может ещё какое-то
        # время выглядеть нормально.
        expr: opencrm_container_healthy == 0
        for: 5m
        # Проверка здоровья ходит в базу; под нагрузкой она проходит через раз,
        # и «нездоров» — «здоров» чередовались бы, пока идёт настоящая беда.
        keep_firing_for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Контейнер {{ $labels.service }} нездоров"
          description: "Проверка здоровья не проходит пять минут подряд."
          lechenie: "./opencrm.sh logs {{ $labels.service }}"

  - name: opencrm-operations
    rules:
      - alert: BackupTooOld
        # Копия снимается таймером в 3:30 с разбросом до 20 минут и
        # `Persistent=true`. 25 часов — это «одна ночь пропущена целиком», то
        # есть таймер не отработал, а не просто сдвинулся.
        expr: time() - max(opencrm_backup_last_timestamp_seconds) > 90000
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "Резервной копии нет уже {{ $value | humanizeDuration }}"
          description: "Последняя копия старше 25 часов — одна ночь пропущена целиком."
          lechenie: |-
            systemctl list-timers opencrm-backup
            ./opencrm.sh backup

      - alert: DigestMissing
        # Утренняя сводка — сама по себе признак живого канала: пока она
        # приходит, бот настроен, база отвечает, расписание работает. И это
        # единственное, чем её неприход можно заметить: отказ отправки виден в
        # журнале и в коде возврата, а несостоявшийся запуск (сорванный таймер,
        # лежащий контейнер) не оставляет ничего вообще. Тишина сводки
        # неотличима от спокойного дня, поэтому шуметь обязан Prometheus.
        #
        # 26 часов, а не 24: сводка уходит в 09:00, и суточный порог краснел бы
        # от обычной задержки расписания на минуту.
        expr: time() - max(opencrm_digest_last_timestamp_seconds) > 93600
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Сводка не приходила уже {{ $value | humanizeDuration }}"
          description: "Утренняя сводка не уходила больше суток."
          lechenie: |-
            systemctl list-timers opencrm-svodka
            ./opencrm.sh svodka

      - alert: BackupBroken
        # Копия, не прошедшая проверку годности, хуже отсутствующей: на неё
        # рассчитывают. Оборванный `.backup` выглядит как база и читается до
        # первой битой страницы.
        expr: min(opencrm_backup_verified) == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Последняя резервная копия НЕГОДНА"
          description: "Копия, не прошедшая проверку годности, хуже отсутствующей: на неё рассчитывают."
          lechenie: "cat ~/opencrm/data/backups/last-check.json"

      - alert: DeployRolledBack
        # Откат — это уже сработавшая защита: сайт живой, но приехавший коммит
        # не встал, и следующий приедет на ту же грабли. Ряд «сколько времени
        # назад» держит сообщение час, а не навсегда: иначе оно висело бы до
        # следующего удачного деплоя и перестало бы что-либо означать.
        expr: >-
          (max(opencrm_deploy_last_status{status=~"rolled-back|broken"}) == 1)
          and on()
          ((time() - max(opencrm_deploy_last_timestamp_seconds)) < 3600)
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Обновление откатилось"
          description: "Последний деплой не встал и был отменён."
          lechenie: "./opencrm.sh history"

      - alert: DatabaseSchemaMismatch
        # Приложение с несошедшейся схемой не поднимается вовсе, поэтому сюда
        # дело обычно не доходит. Но если однажды дойдёт, узнать об этом надо
        # раньше, чем первый раздел ответит 500.
        expr: opencrm_schema_ok == 0
        for: 5m
        # Ряд пропадает вместе с приложением и приезжает заново при старте:
        # без гистерезиса перезапуск контейнера сам по себе давал бы «отбой».
        keep_firing_for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Схема базы не совпадает с моделями"
          description: "Живая база разошлась с моделями — приложение с такой схемой не поднимется."
          lechenie: "./opencrm.sh doctor"

      - alert: RateLimiterUnavailable
        # Общий счётчик попыток (Redis) не отвечает. Пока это длится, вход, PIN
        # и приём заявок отдают 503 — то есть беда ЗАМЕТНА, и тревога здесь не
        # ради обнаружения, а ради причины: «сайт работает, а войти нельзя»
        # иначе ищут в приложении, а сломана соседняя служба.
        #
        # По СОСТОЯНИЮ, а не по приросту счётчика, и это не косметика.
        #
        # Счётчик `opencrm_ratelimiter_unavailable_total` живёт в памяти
        # ПРОЦЕССА, а Prometheus скребёт один адрес: nginx отдаёт запрос
        # случайному рабочему процессу. При нескольких воркерах ряд заскачет
        # между их независимыми значениями, каждое понижение прочитается как
        # перезапуск счётчика, и `increase` покажет прирост там, где его нет, —
        # тревога зазвонит навсегда после первой в жизни неудачи Redis, а
        # настоящую аварию в этом звоне никто не отличит.
        #
        # `..._recently_unavailable` отвечает на вопрос о ТЕКУЩЕЙ обстановке, и
        # ответ у всех процессов одинаков: Redis у них общий. Какой из них
        # ответит на опрос, значения не имеет.
        expr: max(opencrm_ratelimiter_recently_unavailable) > 0
        for: 2m
        # Метрика сама держится минуту после последнего отказа (RECENT_SECONDS),
        # поэтому гистерезис здесь — про людей, а не про данные: пятнадцать
        # минут, чтобы мигающий Redis не давал серию «лёг» — «встал».
        keep_firing_for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Счётчик попыток недоступен — вход отвечает 503"
          description: >-
            Приложение не достучалось до Redis. Защита от подбора не может
            работать, поэтому вход, PIN публичных ссылок и приём заявок
            отказывают, а не пропускают.
          lechenie: "./opencrm.sh logs redis"

      - alert: DecodeQueueSaturated
        # Все места очереди разжатия картинок заняты дольше пяти минут.
        # Не дождавшийся получает 503 `decode_queue_busy`, и до этой тревоги
        # упёршаяся очередь была видна только по жалобе «картинки не
        # грузятся». Пять минут — потому что одно разжатие укладывается в
        # секунду, а очередь ждёт до двух минут: пять минут сплошной занятости
        # это не всплеск, а застрявшее место или поток загрузок.
        expr: max(opencrm_decode_queue_busy) >= max(opencrm_decode_queue_limit)
        for: 5m
        keep_firing_for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Очередь разжатия картинок занята целиком"
          description: >-
            Все места очереди разжатия заняты дольше пяти минут — загрузка
            картинок отвечает 503, пока место не освободится.
          lechenie: "./opencrm.sh logs app"

      - alert: DecodeQueueLocalLimit
        # Предел разжатия держится в памяти процесса, а не в Redis. Это
        # запасной путь, и он не отказ — но при нескольких рабочих процессах
        # пик памяти умножается на их число. Состоянием, а не приростом
        # счётчика: довод тот же, что у RateLimiterUnavailable выше.
        expr: max(opencrm_decode_queue_recently_local) > 0
        for: 2m
        keep_firing_for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Предел разжатия картинок держится в памяти процесса"
          description: >-
            Приложение не достучалось до Redis за местом в очереди разжатия.
            Загрузка работает, но предел теперь свой у каждого процесса.
          lechenie: "./opencrm.sh logs redis"

      - alert: RedisDown
        # Прямой опрос: `RateLimiterUnavailable` выше срабатывает только когда
        # кто-то попробовал войти, а эта — сразу. Ночью, когда входов нет,
        # разница между ними и есть время до починки.
        expr: opencrm_redis_up == 0
        for: 3m
        # Redis, которому не хватает памяти или который перезапускается,
        # отвечает через раз: без гистерезиса это серия «лёг» — «встал».
        keep_firing_for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Redis не отвечает"
          description: >-
            Общий счётчик попыток недоступен. Вход, PIN и приём заявок будут
            отвечать 503 до его возвращения.
          lechenie: "./opencrm.sh logs redis"

      - alert: RateLimiterNotShared
        # А это — беда БЕСШУМНАЯ, и потому опаснее предыдущей. Счётчик в памяти
        # процесса при нескольких рабочих процессах означает порог защиты от
        # подбора, умноженный на их число: каждый процесс честно считает свои
        # пять попыток, ошибки не возникает, снаружи всё выглядит работающим.
        expr: opencrm_ratelimiter_shared == 0
        for: 15m
        keep_firing_for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Счётчик попыток не общий на процессы"
          description: >-
            OPENCRM_REDIS_URL пуст: защита от подбора пароля и PIN считает
            попытки в памяти каждого процесса отдельно — то есть порог молча
            умножается на число процессов.
          lechenie: "./opencrm.sh doctor   # строка «счётчик попыток»"

      - alert: BruteForceBurst
        # Подбор идёт прямо сейчас.
        #
        # **Почему по промахам, а не по запретам.** Запрет ограничителя означает,
        # что защита сработала, — это хорошая новость, и звонить о ней ночью
        # незачем. А вот сотня промахов за пять минут означает, что кто-то
        # методично перебирает, и знать об этом стоит ДО того, как он подберёт.
        #
        # **Почему `increase`, а не `rate`.** Порог задан в попытках, а не в
        # попытках в секунду, и читается он человеком: «сто за пять минут» —
        # это число, о котором можно спорить, «0,33 в секунду» — нет.
        #
        # **Откуда сто.** Живой человек ошибается паролем два-три раза подряд и
        # идёт восстанавливать. Пять промахов упираются в ограничитель
        # (`login_max_attempts`), то есть один человек физически не может дать
        # больше пяти за окно блокировки. Сто промахов за пять минут — это не
        # меньше двадцати разных ключей, то есть перебор по списку почт либо по
        # номерам бланков. Ни то, ни другое случайно не происходит.
        #
        # Счётчик общий на процессы (лежит в Redis), поэтому беды соседнего
        # правила `RateLimiterUnavailable` — скачущий ряд при нескольких
        # воркерах — здесь нет по построению.
        expr: sum(increase(opencrm_security_events_total{vid=~".*_promah"}[5m])) > 100
        for: 5m
        keep_firing_for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Похоже на подбор: много промахов подряд"
          description: >-
            За пять минут набралось больше сотни неудачных попыток — по
            паролю, PIN или номеру бланка. Один человек столько дать не может:
            ограничитель запирает его на пятой. Смотреть, что именно
            перебирают, — на дашборде «безопасность и ошибки».
          lechenie: "Grafana → OpenCRM — безопасность и ошибки → «Подбор: промахи по видам»"

      - alert: UploadsBlocked
        expr: opencrm_uploads_blocked == 1
        for: 10m
        keep_firing_for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Загрузка файлов остановлена нехваткой места"
          description: "Порог — OPENCRM_DISK_MIN_FREE_MB в config/.env."

  # --- база и Redis: деградация, которую видно ЗАРАНЕЕ ------------------------
  #
  # Всё в этой группе — `warning`, и это не осторожность, а разделение труда.
  # Про лежащую базу скажет `SiteDown`: приложение без неё не отвечает вовсе, и
  # узнать об этом надо мгновенно и со звонком. Здесь про другое: база и Redis
  # ещё работают, но запас кончается. Такое сообщение обязано прийти днём и
  # молча — разбудив ночью один раз, оно научит выключать звук всему чату, а
  # выключенный звук чата — это выключенный звук и у аварии тоже.
  #
  # **Имена метрик здесь не выдуманы, а сверены с экспортёрами.** Оба задания
  # сбора идут с жёстким `keep` в `prometheus.yml.template`: из 992 рядов
  # mysqld-exporter и 300 рядов redis_exporter (замерено на стенде запросом к
  # живым контейнерам) доезжает около двух десятков. Правило по метрике, не
  # прошедшей отбор, не сработает НИКОГДА и будет молчать — а молчание,
  # неотличимое от исправности, здесь худший из возможных исходов. Сторож на
  # эту связку — `tests/test_monitoring.py`, он сверяет каждое имя из правил со
  # списком `keep`.
  #
  # Счётчики берутся ПРИРОСТОМ, а не значением. `mysql_global_status_*` и
  # `redis_*_total` живут от старта сервера: один медленный запрос в прошлом
  # году навсегда сделал бы `slow_queries > 0` истиной. Тот же урок, что стоил
  # правилу `RateLimiterUnavailable` перехода на `increase`.
  - name: opencrm-storage
    rules:
      - alert: DatabaseConnectionsHigh
        # Потолок берётся у самого сервера (`max_connections`), а не вписан
        # числом: он разный у настроек по умолчанию (151) и у подкрученных, и
        # вписанное число разошлось бы с правдой молча.
        #
        # 80% — это ещё запас, но уже видно дно: оставшиеся соединения съедает
        # один всплеск, и следующий клиент получает «Too many connections», то
        # есть пятисотку. Десять минут выдержки — чтобы всплеск на резервной
        # копии или переиндексации не считался бедой.
        expr: >-
          mysql_global_status_threads_connected
          /
          mysql_global_variables_max_connections
          > 0.8
        for: 10m
        # Число соединений дышит с каждым запросом; у самого порога без
        # гистерезиса это серия «тревога» — «всё в порядке».
        keep_firing_for: 30m
        labels:
          severity: warning
        annotations:
          summary: >-
            Соединений к базе — {{ $value | humanizePercentage }} от потолка (порог 80%)
          description: >-
            Запас до «Too many connections» кончается; потолок — max_connections
            на сервере базы.
          lechenie: "./opencrm.sh logs app"

      - alert: DatabaseLockWaits
        # Ожидание блокировки строки — это запрос, который стоит и ждёт чужой
        # транзакции. Пока их единицы, никто ничего не замечает; десяток в
        # минуту означает, что сайт уже подтормаживает на записи, а разглядеть
        # это в логах нечем — ошибки-то нет.
        expr: rate(mysql_global_status_innodb_row_lock_waits[5m]) * 60 > 10
        for: 10m
        keep_firing_for: 15m
        labels:
          severity: warning
        annotations:
          summary: >-
            Ожиданий блокировок в базе — {{ $value | printf "%.0f" }} в минуту (порог 10)
          description: >-
            Запросы стоят в очереди за чужими транзакциями: запись подтормаживает,
            а ошибки при этом нет ни одной. Панель «база» на дашборде сервера.

      - alert: DatabaseSlowQueries
        # `Slow_queries` считает запросы дольше `long_query_time` (по умолчанию
        # 10 секунд). Пять таких в минуту — это уже не «тяжёлый отчёт раз в
        # день», а что-то систематическое: потерянный индекс после миграции или
        # выросшая таблица. Выдержка вдвое длиннее соседних: ночная
        # переиндексация и резервная копия дают ровно такую же картину и
        # проходят сами.
        expr: rate(mysql_global_status_slow_queries[5m]) * 60 > 5
        for: 15m
        keep_firing_for: 30m
        labels:
          severity: warning
        annotations:
          summary: >-
            Медленных запросов — {{ $value | printf "%.1f" }} в минуту (порог 5)
          description: >-
            Запросы дольше long_query_time идут потоком. Обычная причина —
            потерянный индекс после правки схемы либо выросшая таблица.

      - alert: DatabaseBufferPoolMisses
        # Доля попаданий в буферный пул: сколько чтений InnoDB обслужил из
        # памяти, не ходя на диск. Ниже 95% означает, что рабочий набор в
        # `innodb_buffer_pool_size` больше не помещается, — и это единственный
        # честный признак того, что база переросла машину. Снаружи он выглядит
        # как «сайт стал медленнее», и без этой цифры причину ищут в коде.
        #
        # Знаменатель ограничен снизу по той же причине, что в `HighErrorRate`:
        # на спящей базе доля считается от трёх чтений за полчаса, и одно
        # обращение к диску даёт 67% на ровном месте. Ниже десяти запросов в
        # секунду говорить не о чем — нагрузки нет.
        #
        # Окно получасовое, а не пятиминутное: показатель по природе медленный,
        # а пятиминутный давал бы всплеск на каждой резервной копии, которая
        # честно вычитывает базу с диска мимо пула.
        expr: >-
          (
            1 -
            rate(mysql_global_status_innodb_buffer_pool_reads[30m])
            /
            rate(mysql_global_status_innodb_buffer_pool_read_requests[30m])
          ) < 0.95
          and
          rate(mysql_global_status_innodb_buffer_pool_read_requests[30m]) > 10
        for: 30m
        keep_firing_for: 30m
        labels:
          severity: warning
        annotations:
          summary: >-
            Попаданий в буферный пул — {{ $value | humanizePercentage }} (порог 95%)
          description: >-
            Рабочий набор базы перестал помещаться в память: чтения идут на диск,
            и сайт отвечает медленнее без единой ошибки. Смотреть
            innodb_buffer_pool_size против размера базы.

      - alert: DatabaseMetricsUnavailable
        # Именно `warning`, а не `critical`, и это разобрано осознанно. Ряд
        # `mysql_up` равен нулю, когда экспортёр не смог ПОДКЛЮЧИТЬСЯ, — а самая
        # частая причина этого не лежащая база, а незаведённый пользователь
        # наблюдателя (`OPENCRM_DB_EXPORTER_*` в docker/.env). Про по-настоящему
        # лежащую базу скажет `SiteDown`: приложение без неё не отвечает вовсе.
        # Будить человека ради чужого пароля — верный способ научить его не
        # читать этот чат.
        #
        # Оговорка: ряд ЕСТЬ, пока жив сам экспортёр. Умри контейнер целиком —
        # ряд пропадёт, и правило замолчит; этот случай ловят
        # `ContainerRestartLoop` и `ContainerUnhealthy`, а `up{job="mysql"}`
        # виден на дашборде, потому что через `keep` он не проходит вовсе.
        expr: mysql_up == 0
        for: 15m
        # Мигает не порог, а само подключение: база в перезапуске отвечает через
        # раз, и без гистерезиса это серия «метрик нет» — «метрики есть».
        keep_firing_for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Метрики базы не собираются: наблюдатель не подключается к MySQL"
          description: >-
            Чаще всего не заведён пользователь наблюдателя — запрос на создание
            лежит в docker/.env.example рядом с OPENCRM_DB_EXPORTER_PASSWORD.
          lechenie: "./opencrm.sh logs db-exporter"

      - alert: RedisEvictingKeys
        # Единственное правило в группе, которое про безопасность, а не про
        # скорость. В Redis лежат счётчики попыток входа, и политика
        # `allkeys-lru` при нехватке памяти выбрасывает самые старые. Каждый
        # вытесненный ключ — это забытая попытка подбора: счётчик обнуляется,
        # порог отодвигается, а снаружи всё выглядит исправным. Отказа нет,
        # ошибки нет, в логах пусто — поэтому порог здесь ноль: вытеснение либо
        # есть, либо его нет, и «немножко» не бывает.
        #
        # Прирост, а не значение: счётчик живёт от старта Redis и после первого
        # же вытеснения остался бы ненулевым навсегда.
        expr: increase(redis_evicted_keys_total[15m]) > 0
        for: 5m
        # Окно `increase` скользящее: как только вытеснения выпадут из
        # пятнадцати минут, счёт провалится в ноль и вернётся со следующим. Без
        # гистерезиса это череда сообщений об одной и той же беде.
        keep_firing_for: 30m
        labels:
          severity: warning
        annotations:
          summary: >-
            Redis вытеснил {{ $value | printf "%.0f" }} ключей за 15 минут
          description: >-
            Память кончилась, и старые ключи выбрасываются. В них лежат счётчики
            попыток входа: вытесненный счётчик — это забытая попытка подбора.
            Поднять потолок: OPENCRM_REDIS_MAXMEMORY в docker/.env.

      - alert: RedisMemoryNearLimit
        # То же самое, но ДО того, как началось вытеснение: при `allkeys-lru`
        # Redis, упершийся в потолок, стоит у него постоянно, и предупреждение
        # «занято 92%» приходит на несколько часов раньше первого выброшенного
        # ключа. Ради этой форы правило и заведено отдельно от соседнего.
        #
        # `redis_memory_max_bytes > 0` — не украшение. Потолок настраивается
        # (`OPENCRM_REDIS_MAXMEMORY`), а значение `0` означает «без потолка»; на
        # такой установке деление дало бы +Inf, и правило горело бы вечно с
        # первой же секунды. Тревога, зажжённая навсегда, не тревога.
        expr: >-
          redis_memory_used_bytes / redis_memory_max_bytes > 0.9
          and redis_memory_max_bytes > 0
        for: 15m
        keep_firing_for: 30m
        labels:
          severity: warning
        annotations:
          summary: >-
            Redis занял {{ $value | humanizePercentage }} своего потолка (порог 90%)
          description: >-
            Дальше начнётся вытеснение старых ключей, то есть забытые попытки
            входа. Потолок — OPENCRM_REDIS_MAXMEMORY в docker/.env.

      - alert: RealtimeHintsDropped
        # Живые обновления при лежащем Redis не отказывают, а молчат: намёк
        # теряется, продукт работает как до живого слоя (docs/ustroystvo/12-zhivye-obnovleniya.md
        # §11). Без тревоги это состояние видно только тому, кто откроет логи,
        # а вкладки тем временем показывают полосу «обновления приостановлены».
        expr: increase(opencrm_realtime_dropped_total[10m]) > 0
        for: 5m
        keep_firing_for: 30m
        labels:
          severity: warning
        annotations:
          summary: >-
            Живые обновления теряют намёки: {{ $value | printf "%.0f" }} за 10 минут
          description: >-
            Redis не принимает записи в поток. Экраны сотрудников перечитываются
            сами, но реже; проверьте контейнер redis и его память.
