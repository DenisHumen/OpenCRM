# Источники данных заводятся файлом, а не руками в интерфейсе.
#
# Руками — значит «после переустановки Grafana дашборды пустые, и почему,
# никто не помнит». Файл едет вместе с репозиторием, и восстановление
# мониторинга после сноса каталога стоит одного `up -d`.
#
# `uid` задан явно и не должен меняться: на него ссылается каждая панель в
# dashboards/*.json. Сгенерированный Grafana случайный uid после переустановки
# был бы другим, и все панели показали бы «datasource not found».

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: opencrm-prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # Совпадает со `scrape_interval`: без этого Grafana подставляет в
      # `rate()` окно короче шага сбора, и график получается рваным.
      timeInterval: 30s

  # Логи. Источник объявлен всегда, а контейнер Loki живёт в профиле
  # `monitoring-logs` — без профиля панели с логами честно скажут, что источник
  # не отвечает. Это лучше, чем спрятанный источник: видно, что логи выключены,
  # а не что их не бывает.
  - name: Loki
    type: loki
    uid: opencrm-loki
    access: proxy
    url: http://loki:3100
    editable: false
