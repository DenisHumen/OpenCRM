# OpenCRM — nginx перед uvicorn.
# TLS: выпустить сертификат (certbot), добавить server-блок на 443 с теми же location
# и включить редирект 80 → 443 (см. docs/08-deployment.md).

server {
    listen 80;
    server_name _;

    client_max_body_size 220m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # медиа витрин — напрямую с тома; файлы неизменяемые
    location /media/ {
        alias /srv/storage/media/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;

        # оригиналы наружу не отдаются — только производные (large/card/thumb/poster/video)
        location ~ /original\.[a-z0-9]+$ {
            return 404;
        }
    }

    location /branding/ {
        alias /srv/storage/branding/;
        add_header Cache-Control "public, max-age=3600";
    }

    location /avatars/ {
        alias /srv/storage/avatars/;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff";
    }

    # внутренние файлы клиентов app отдаёт сам после проверки сессии

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
