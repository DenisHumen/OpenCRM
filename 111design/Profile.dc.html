<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <title>OpenCRM — Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet">
  <style>
    body { margin:0; background:#262624; -webkit-font-smoothing:antialiased; }
    a { color:#6C8EEF; } a:hover { color:#8FA8F3; }
    ::placeholder { color:#706D64; }
  </style>
</helmet>
<div style="display:flex;min-height:100vh;background:#262624;font-family:Inter,sans-serif">
  <dc-import name="Sidebar" active="none" hint-size="260px,100vh"></dc-import>
  <main style="flex:1;min-width:0">
    <div style="max-width:640px;margin:0 auto;padding:44px 40px 72px;box-sizing:border-box">
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:32px">
        <div style="width:52px;height:52px;border-radius:50%;background:#34322E;color:#F5F4EF;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600">DH</div>
        <div>
          <h1 style="font-family:'Source Serif 4',serif;font-size:28px;font-weight:400;color:#F5F4EF;margin:0">Profile</h1>
          <div style="color:#706D64;font-size:13px;margin-top:4px">root@studio.site · <span style="color:#D97757">Root</span> · joined Feb 12, 2026</div>
        </div>
      </div>
      <div style="background:#2B2A27;border:1px solid #3B3A36;border-radius:12px;padding:22px 24px;margin-bottom:16px">
        <div style="color:#F5F4EF;font-size:14px;font-weight:600;margin-bottom:16px">Account</div>
        <label style="display:block;color:#9C998F;font-size:12.5px;margin-bottom:5px">Display name</label>
        <input defaultValue="Denis" style="width:100%;height:34px;background:#262624;border:1px solid #3B3A36;border-radius:8px;color:#F5F4EF;font-size:13.5px;padding:0 12px;box-sizing:border-box;outline:none;font-family:Inter,sans-serif;margin-bottom:14px" style-focus="border-color:#6C8EEF">
        <label style="display:block;color:#9C998F;font-size:12.5px;margin-bottom:5px">Email <span style="color:#706D64">(sign-in, cannot be changed)</span></label>
        <input value="root@studio.site" disabled style="width:100%;height:34px;background:#232321;border:1px solid #34322E;border-radius:8px;color:#706D64;font-size:13.5px;padding:0 12px;box-sizing:border-box;outline:none;font-family:Inter,sans-serif">
      </div>
      <div style="background:#2B2A27;border:1px solid #3B3A36;border-radius:12px;padding:22px 24px;margin-bottom:16px">
        <div style="color:#F5F4EF;font-size:14px;font-weight:600;margin-bottom:16px">Interface language</div>
        <div style="display:flex;gap:6px;margin-bottom:12px">
          <sc-for list="{{ langs }}" as="l" hint-placeholder-count="2">
            <div onClick="{{ l.select }}" style="{{ l.style }}">{{ l.label }}</div>
          </sc-for>
        </div>
        <div style="color:#706D64;font-size:11.5px">Saved to your account — applies on every device.</div>
      </div>
      <div style="background:#2B2A27;border:1px solid #3B3A36;border-radius:12px;padding:22px 24px;margin-bottom:24px">
        <div style="color:#F5F4EF;font-size:14px;font-weight:600;margin-bottom:16px">Change password</div>
        <label style="display:block;color:#9C998F;font-size:12.5px;margin-bottom:5px">Current password</label>
        <input type="password" placeholder="••••••••" style="width:100%;height:34px;background:#262624;border:1px solid #3B3A36;border-radius:8px;color:#F5F4EF;font-size:13.5px;padding:0 12px;box-sizing:border-box;outline:none;font-family:Inter,sans-serif;margin-bottom:14px" style-focus="border-color:#6C8EEF">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;margin-bottom:16px">
          <div>
            <label style="display:block;color:#9C998F;font-size:12.5px;margin-bottom:5px">New password</label>
            <input type="password" placeholder="Min 10 characters" style="width:100%;height:34px;background:#262624;border:1px solid #3B3A36;border-radius:8px;color:#F5F4EF;font-size:13.5px;padding:0 12px;box-sizing:border-box;outline:none;font-family:Inter,sans-serif" style-focus="border-color:#6C8EEF">
          </div>
          <div>
            <label style="display:block;color:#9C998F;font-size:12.5px;margin-bottom:5px">Repeat new password</label>
            <input type="password" placeholder="Once more" style="width:100%;height:34px;background:#262624;border:1px solid #3B3A36;border-radius:8px;color:#F5F4EF;font-size:13.5px;padding:0 12px;box-sizing:border-box;outline:none;font-family:Inter,sans-serif" style-focus="border-color:#6C8EEF">
          </div>
        </div>
        <div style="height:32px;display:inline-flex;align-items:center;padding:0 14px;border:1px solid #3B3A36;border-radius:8px;color:#F5F4EF;font-size:12.5px;font-weight:500;cursor:pointer;box-sizing:border-box" style-hover="background:#34322E">Update password</div>
      </div>
      <div onClick="{{ save }}" style="{{ saveStyle }}">{{ saveLabel }}</div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { lang: "English", saved: false };
  renderVals() {
    const on = "height:30px;display:flex;align-items:center;padding:0 14px;border-radius:8px;background:#34322E;border:1px solid #3B3A36;color:#F5F4EF;font-size:12.5px;font-weight:500;cursor:pointer;box-sizing:border-box";
    const off = "height:30px;display:flex;align-items:center;padding:0 14px;border-radius:8px;border:1px solid #3B3A36;color:#9C998F;font-size:12.5px;cursor:pointer;box-sizing:border-box";
    return {
      langs: ["English", "Русский"].map(l => ({ label: l, style: l === this.state.lang ? on : off, select: () => this.setState({ lang: l }) })),
      saveLabel: this.state.saved ? "Saved" : "Save changes",
      saveStyle: "height:36px;display:inline-flex;align-items:center;padding:0 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;box-sizing:border-box;transition:background 150ms;" + (this.state.saved ? "background:rgba(76,175,110,0.15);color:#4CAF6E" : "background:#FAF9F5;color:#1F1E1C"),
      save: () => { this.setState({ saved: true }); clearTimeout(this._t); this._t = setTimeout(() => this.setState({ saved: false }), 2000); }
    };
  }
}
</script>
</body>
</html>
