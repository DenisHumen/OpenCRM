<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:260px;min-width:260px;background:#1F1E1C;border-right:1px solid #3B3A36;height:100vh;position:sticky;top:0;display:flex;flex-direction:column;font-family:Inter,sans-serif;box-sizing:border-box">
  <div style="padding:16px 16px 8px;display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <a href="Dashboard.dc.html" style="display:flex;align-items:center;gap:8px;text-decoration:none">
        <div style="width:20px;height:20px;border-radius:6px;background:#D97757;display:flex;align-items:center;justify-content:center;color:#1F1E1C;font-size:11px;font-weight:700">O</div>
        <span style="color:#F5F4EF;font-size:14px;font-weight:600;letter-spacing:0.01em">OpenCRM</span>
      </a>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#706D64" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="cursor:pointer"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M9 3v18"></path></svg>
    </div>
    <div style="display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid #3B3A36;border-radius:8px;cursor:pointer;background:#262624" style-hover="background:#2B2A27">
      <div style="width:22px;height:22px;border-radius:5px;background:rgba(217,119,87,0.18);color:#D97757;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700">F</div>
      <div style="flex:1;min-width:0">
        <div style="color:#F5F4EF;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ brandName }}</div>
      </div>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#706D64" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m7 15 5 5 5-5"></path><path d="m7 9 5-5 5 5"></path></svg>
    </div>
    <div style="display:flex;align-items:center;gap:8px;padding:0 10px;height:32px;border:1px solid #3B3A36;border-radius:8px;background:#262624;cursor:text">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#706D64" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
      <span style="flex:1;color:#706D64;font-size:13px">Search</span>
      <span style="display:flex;gap:3px">
        <span style="font-size:10px;color:#9C998F;background:rgba(255,255,255,0.07);border-radius:4px;padding:2px 5px;font-weight:500">Ctrl</span>
        <span style="font-size:10px;color:#9C998F;background:rgba(255,255,255,0.07);border-radius:4px;padding:2px 5px;font-weight:500">K</span>
      </span>
    </div>
  </div>
  <nav style="padding:8px;display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto">
    <sc-for list="{{ navItems }}" as="it" hint-placeholder-count="4">
      <a href="{{ it.href }}" style="{{ it.style }}" style-hover="{{ it.hoverStyle }}">
        <span style="width:16px;height:16px;display:flex;align-items:center;justify-content:center" dangerouslySetInnerHTML="{{ it.icon }}"></span>
        <span style="flex:1">{{ it.label }}</span>
        <sc-if value="{{ it.chevron }}" hint-placeholder-val="{{ false }}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#706D64" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
        </sc-if>
      </a>
    </sc-for>
    <div style="margin:12px 10px 4px;font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#706D64">Admin</div>
    <sc-for list="{{ adminItems }}" as="it" hint-placeholder-count="2">
      <a href="{{ it.href }}" style="{{ it.style }}" style-hover="{{ it.hoverStyle }}">
        <span style="width:16px;height:16px;display:flex;align-items:center;justify-content:center" dangerouslySetInnerHTML="{{ it.icon }}"></span>
        <span style="flex:1">{{ it.label }}</span>
      </a>
    </sc-for>
  </nav>
  <div style="padding:12px;display:flex;flex-direction:column;gap:10px;border-top:1px solid #2B2A27">
    <sc-if value="{{ showBanner }}" hint-placeholder-val="{{ true }}">
      <a href="Staff.dc.html" style="display:block;background:rgba(232,162,61,0.13);border-radius:8px;padding:10px 12px;font-size:12px;line-height:1.5;color:#E8A23D;text-decoration:none">
        <strong style="font-weight:600">{{ pendingCount }} signup requests</strong> are awaiting approval. <span style="text-decoration:underline;text-underline-offset:2px">Review</span>
      </a>
    </sc-if>
    <a href="#" style="display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;color:#9C998F;font-size:13px;text-decoration:none" style-hover="background:#2B2A27;color:#F5F4EF">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg>
      Documentation
    </a>
    <div style="position:relative">
      <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;bottom:46px;left:0;right:0;background:#2B2A27;border:1px solid #3B3A36;border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:2px;box-sizing:border-box">
          <a href="Profile.dc.html" style="display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:#F5F4EF;font-size:13px;text-decoration:none" style-hover="background:#34322E">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9C998F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"></circle><path d="M20 21a8 8 0 0 0-16 0"></path></svg>
            Profile
          </a>
          <div style="display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:#F5F4EF;font-size:13px;cursor:pointer" style-hover="background:#34322E">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9C998F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 8 6 6"></path><path d="m4 14 6-6 2-3"></path><path d="M2 5h12"></path><path d="M7 2h1"></path><path d="m22 22-5-10-5 10"></path><path d="M14 18h6"></path></svg>
            <span style="flex:1">Language</span>
            <span style="color:#706D64;font-size:12px">English</span>
          </div>
          <div style="height:1px;background:#3B3A36;margin:4px 6px"></div>
          <a href="Auth.dc.html" style="display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:#E5695E;font-size:13px;text-decoration:none" style-hover="background:#34322E">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="m16 17 5-5-5-5"></path><path d="M21 12H9"></path></svg>
            Sign out
          </a>
        </div>
      </sc-if>
      <div onClick="{{ toggleMenu }}" style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer" style-hover="background:#2B2A27">
        <div style="width:28px;height:28px;border-radius:50%;background:#34322E;color:#F5F4EF;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600">DH</div>
        <div style="flex:1;min-width:0">
          <div style="color:#F5F4EF;font-size:13px;font-weight:500">Denis</div>
          <div style="color:#706D64;font-size:11px">Root</div>
        </div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#706D64" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m7 15 5 5 5-5"></path><path d="m7 9 5-5 5 5"></path></svg>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 260, &quot;height&quot;: 900}, &quot;active&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;dashboard&quot;, &quot;clients&quot;, &quot;boards&quot;, &quot;staff&quot;, &quot;settings&quot;, &quot;none&quot;], &quot;default&quot;: &quot;dashboard&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;brandName&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Formwork Studio&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;pendingCount&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 2, &quot;min&quot;: 0, &quot;max&quot;: 20, &quot;tsType&quot;: &quot;number&quot;}}">
class Component extends DCLogic {
  state = { menuOpen: false };
  renderVals() {
    const active = this.props.active ?? "dashboard";
    const base = "display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;font-size:13.5px;text-decoration:none;color:#9C998F;font-weight:450";
    const act = "display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;font-size:13.5px;text-decoration:none;color:#F5F4EF;font-weight:500;background:#34322E";
    const hov = "background:#2B2A27;color:#F5F4EF";
    const ic = (paths) => ({ __html: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' + paths + '</svg>' });
    const mk = (id, label, href, icon, chevron) => ({
      label, href, icon: ic(icon), chevron: !!chevron,
      style: id === active ? act : base,
      hoverStyle: id === active ? "" : hov
    });
    return {
      brandName: this.props.brandName ?? "Formwork Studio",
      pendingCount: this.props.pendingCount ?? 2,
      showBanner: (this.props.pendingCount ?? 2) > 0,
      menuOpen: this.state.menuOpen,
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      navItems: [
        mk("dashboard", "Dashboard", "Dashboard.dc.html", '<rect x="3" y="3" width="7" height="9" rx="1"></rect><rect x="14" y="3" width="7" height="5" rx="1"></rect><rect x="14" y="12" width="7" height="9" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect>'),
        mk("clients", "Clients", "Clients.dc.html", '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path>'),
        mk("boards", "Boards", "Boards.dc.html", '<rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M3 12h18"></path><path d="M12 3v18"></path>'),
        mk("analytics", "Analytics", "#", '<path d="M3 3v16a2 2 0 0 0 2 2h16"></path><path d="M18 17V9"></path><path d="M13 17V5"></path><path d="M8 17v-3"></path>', true)
      ],
      adminItems: [
        mk("staff", "Staff", "Staff.dc.html", '<path d="M2 21a8 8 0 0 1 13.292-6"></path><circle cx="10" cy="8" r="5"></circle><path d="m16 19 2 2 4-4"></path>'),
        mk("settings", "Site settings", "Settings.dc.html", '<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle>')
      ]
    };
  }
}
</script>
</body>
</html>
