<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <title>OpenCRM — Boards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet">
  <script src="./image-slot.js"></script>
  <style>
    body { margin:0; background:#262624; -webkit-font-smoothing:antialiased; }
    a { color:#6C8EEF; } a:hover { color:#8FA8F3; }
    ::placeholder { color:#706D64; }
  </style>
</helmet>
<div style="display:flex;min-height:100vh;background:#262624;font-family:Inter,sans-serif">
  <dc-import name="Sidebar" active="boards" hint-size="260px,100vh"></dc-import>
  <main style="flex:1;min-width:0">
    <div style="max-width:1000px;margin:0 auto;padding:44px 40px 72px;box-sizing:border-box">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px">
        <div>
          <h1 style="font-family:'Source Serif 4',serif;font-size:30px;font-weight:400;color:#F5F4EF;margin:0">Boards</h1>
          <div style="color:#706D64;font-size:13px;margin-top:6px">12 boards · 8 published</div>
        </div>
        <a href="BoardEditor.dc.html" style="display:flex;align-items:center;gap:7px;height:36px;padding:0 14px;background:#FAF9F5;border-radius:8px;color:#1F1E1C;font-size:13px;font-weight:600;text-decoration:none;box-sizing:border-box" style-hover="background:#FFFFFF;color:#1F1E1C">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
          New board
        </a>
      </div>
      <div style="display:flex;gap:6px;margin-bottom:20px">
        <sc-for list="{{ filters }}" as="f" hint-placeholder-count="4">
          <div onClick="{{ f.select }}" style="{{ f.style }}">{{ f.label }}</div>
        </sc-for>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px">
        <sc-for list="{{ boards }}" as="b" hint-placeholder-count="6">
          <a href="BoardEditor.dc.html" style="display:block;background:#2B2A27;border:1px solid #3B3A36;border-radius:12px;overflow:hidden;text-decoration:none;transition:background 150ms" style-hover="background:#34322E">
            <div style="height:150px;position:relative">
              <image-slot id="{{ b.slotId }}" shape="rect" placeholder="Drop a cover"></image-slot>
              <sc-if value="{{ b.revoked }}" hint-placeholder-val="{{ false }}">
                <div style="position:absolute;inset:0;background:rgba(38,38,36,0.55);pointer-events:none"></div>
              </sc-if>
            </div>
            <div style="padding:14px 16px 16px">
              <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap">
                <span style="color:#F5F4EF;font-size:14px;font-weight:500">{{ b.title }}</span>
                <sc-for list="{{ b.badges }}" as="bd" hint-placeholder-count="1">
                  <span style="{{ bd.style }}">{{ bd.label }}</span>
                </sc-for>
              </div>
              <div style="color:#706D64;font-size:12.5px;margin-bottom:10px">{{ b.client }}</div>
              <div style="display:flex;gap:6px">
                <span style="height:22px;display:inline-flex;align-items:center;gap:4px;padding:0 8px;border-radius:6px;background:rgba(255,255,255,0.07);color:#9C998F;font-size:11.5px;font-weight:500">
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path></svg>
                  {{ b.works }}
                </span>
                <span style="height:22px;display:inline-flex;align-items:center;gap:4px;padding:0 8px;border-radius:6px;background:rgba(255,255,255,0.07);color:#9C998F;font-size:11.5px;font-weight:500">
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg>
                  {{ b.views }}
                </span>
                <span style="margin-left:auto;color:#706D64;font-size:11.5px;align-self:center">{{ b.updated }}</span>
              </div>
            </div>
          </a>
        </sc-for>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { filter: "All" };
  renderVals() {
    const chipG = "height:22px;display:inline-flex;align-items:center;padding:0 8px;border-radius:6px;background:rgba(76,175,110,0.15);color:#4CAF6E;font-size:11.5px;font-weight:500";
    const chipA = "height:22px;display:inline-flex;align-items:center;padding:0 8px;border-radius:6px;background:rgba(232,162,61,0.15);color:#E8A23D;font-size:11.5px;font-weight:500";
    const chipB = "height:22px;display:inline-flex;align-items:center;padding:0 8px;border-radius:6px;background:rgba(108,142,239,0.15);color:#6C8EEF;font-size:11.5px;font-weight:500";
    const chipN = "height:22px;display:inline-flex;align-items:center;padding:0 8px;border-radius:6px;background:rgba(255,255,255,0.07);color:#9C998F;font-size:11.5px;font-weight:500";
    const all = [
      { slotId: "bd-1", title: "Coffee shop logos", client: "Anna Kovaleva · Roast & Co", badges: [{ label: "Published", style: chipG }], works: "14", views: "89", updated: "Jul 18", status: "Published" },
      { slotId: "bd-2", title: "Nord fitness rebrand", client: "Mark Bergman · Nord Fitness", badges: [{ label: "Draft", style: chipA }], works: "6", views: "—", updated: "Jul 21", status: "Drafts" },
      { slotId: "bd-3", title: "Packaging — Sadko tea", client: "Sadko Tea", badges: [{ label: "Published", style: chipG }, { label: "PIN", style: chipB }], works: "22", views: "31", updated: "Jul 15", status: "Published" },
      { slotId: "bd-4", title: "Website concepts", client: "Pavel Krylov · Krylov Architects", badges: [{ label: "Published", style: chipG }], works: "9", views: "12", updated: "Jul 10", status: "Published" },
      { slotId: "bd-5", title: "Menu design v1", client: "Greenhouse Café", badges: [{ label: "Link revoked", style: chipN }], works: "11", views: "47", updated: "Jun 28", status: "Revoked", revoked: true },
      { slotId: "bd-6", title: "Roast & Co packaging", client: "Anna Kovaleva · Roast & Co", badges: [{ label: "Draft", style: chipA }], works: "6", views: "—", updated: "Jun 24", status: "Drafts" }
    ];
    const f = this.state.filter;
    const filters = ["All", "Published", "Drafts", "Revoked"];
    const on = "height:30px;display:flex;align-items:center;padding:0 12px;border-radius:8px;background:#34322E;border:1px solid #3B3A36;color:#F5F4EF;font-size:12.5px;font-weight:500;cursor:pointer;box-sizing:border-box";
    const off = "height:30px;display:flex;align-items:center;padding:0 12px;border-radius:8px;border:1px solid transparent;color:#9C998F;font-size:12.5px;cursor:pointer;box-sizing:border-box";
    return {
      filters: filters.map(x => ({ label: x, style: x === f ? on : off, select: () => this.setState({ filter: x }) })),
      boards: f === "All" ? all : all.filter(b => b.status === f)
    };
  }
}
</script>
</body>
</html>
