; Агент OpenCRM внутри docker-mailserver (docs/bloki/32-pochtovyy-server.md).
; supervisord контейнера включает /etc/supervisor/conf.d/*.conf — файл туда
; монтирует core/pochta/compose.yml, сам агент — из чекаута OpenCRM.
[program:opencrm-agent]
command=/usr/bin/python3 /opt/opencrm/agent.py serve
autostart=true
autorestart=true
startsecs=2
startretries=10
stopwaitsecs=5
user=root
redirect_stderr=true
stdout_logfile=/var/log/supervisor/opencrm-agent.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
